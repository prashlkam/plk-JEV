# Keep the JEV workspace out of systemd-tmpfiles' 30-day sweep of /var/tmp.
#
# /usr/lib/tmpfiles.d/tmp.conf ships `q /var/tmp 1777 root root 30d`, which would
# delete the venv, HF cache, datasets and checkpoints after 30 days of inactivity.
# The workspace lives there because /home has only ~7 GiB free while / has ~63 GiB
# (HARDWARE.md revision 7).
#
# Install:  sudo cp packaging/tmpfiles-jev.conf /etc/tmpfiles.d/jev-workspace.conf
# Verify:   systemd-tmpfiles --clean --dry-run 2>&1 | grep jev-workspace   # no output = safe
#
# `x` excludes the path and everything under it from cleanup.
x /var/tmp/jev-workspace
